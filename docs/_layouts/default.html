<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    :root { --accent: #c4361a; --ink: #1f1b18; --muted: #6a625c; --bg: #f7f4ee; --rule: #ded8cc; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); }
    header { background: var(--ink); color: #f7f4ee; padding: 24px 20px; }
    header .inner, main { max-width: 760px; margin: 0 auto; }
    header strong { font-size: 22px; letter-spacing: .2px; }
    main { padding: 28px 20px 64px; }
    h1 { font-size: 30px; line-height: 1.25; margin: 0 0 12px; }
    h2 { font-size: 21px; margin: 34px 0 8px; color: var(--accent); }
    a { color: var(--accent); }
    ul { padding-left: 22px; }
    li { margin: 6px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 15px; }
    th, td { border-bottom: 1px solid var(--rule); padding: 8px 6px; text-align: left; vertical-align: top; }
    footer { max-width: 760px; margin: 0 auto; padding: 0 20px 40px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header><div class="inner"><strong>Inkfold: PDF Reader &amp; Signer</strong></div></header>
  <main>
    {{ content }}
  </main>
  <footer>&copy; Daily Applications</footer>
</body>
</html>
